# =============================================================
# 网关运行时配置文件
#
# 密钥策略（重要）：
#   这个文件可以安全地进版本库，因为它里面一个明文密码都没有。
#   所有敏感值都写成 ${VAR} 占位符，真实值有两个来源：
#     1. 进程环境变量（k8s Secret / docker -e / export），优先级最高
#     2. 仓库根目录的 .env（本地开发用，已在 .gitignore 里排除）
#
#   插值支持两种写法：
#     ${VAR}         取环境变量，没配就是空字符串
#     ${VAR:-默认值} 取环境变量，没配就用默认值
#
#   变量清单见根目录 .env.example。
# =============================================================

server:
  port: ${GATEWAY_PORT:-8080}
  # 读超时：请求头+请求体读取的最长时间
  read_timeout_seconds: 30
  # 写超时：响应写出的最长时间。流式响应可能持续很久，这个值要给够，
  # 否则长对话会被服务器主动掐断。
  #write_timeout_seconds: 300
  # 整体写超时：设为 0（关闭）。http.Server.WriteTimeout 是从请求头读完开始计时的绝对期限，
  # 300 秒就意味着任何超过 300 秒的流式响应都会被服务器强行截断。
  # 改由下面两项控制：滚动的"单次写超时"（防慢客户端）和单个流的总时长上限（防无限生成占 GPU）。
  write_timeout_seconds: 0
  stream_write_timeout_seconds: 30
  max_stream_seconds: 900
  # 优雅关闭：收到 SIGTERM 后，先让 /readyz 返回 503 并等 drain_seconds（让 LB 摘流量），
  # 再等在途请求完成最多 shutdown_grace_seconds（0 = max_stream_seconds + 30）。
  # K8s 的 terminationGracePeriodSeconds 必须 >= drain_seconds + shutdown_grace_seconds。
  drain_seconds: 5
  shutdown_grace_seconds: 0
  # 网关副本数。Redis 故障时，每个副本只放行 1/expected_replicas 的限流/配额份额。
  expected_replicas: 1

  # 请求体最大字节数，防止恶意请求发超大 body 把内存撑爆
  max_body_bytes: 10485760 # 10MB
  # 可信代理（IP 或 CIDR）。网关只会采纳来自这些地址的 X-Forwarded-For / X-Real-IP。
  # 空列表 = 谁都不信，c.ClientIP() 就是 TCP 对端地址（直接暴露公网时的正确选择）。
  # 部署在 LB / Ingress 之后，才把它们的网段写在这里，例如：
  #   trusted_proxies: ["10.0.0.0/8"]
  trusted_proxies: []

# 日志配置
# level:  debug / info / warn / error（线上建议 info 或 warn）
# format: text（本地人读）/ json（日志平台采集）
log:
  level: ${LOG_LEVEL:-info}
  format: ${LOG_FORMAT:-text}

# Redis 配置：限流令牌桶状态 + 每日配额计数都存在这里，
# 多个网关实例共享同一个 Redis，限流/配额才是全局生效的。
redis:
  addr: ${REDIS_ADDR:-localhost:6379}
  password: ${REDIS_PASSWORD:-} # 本地开发通常没有密码
  db: ${REDIS_DB:-0}
  dial_timeout_ms: 2000
  read_timeout_ms: 1000
  write_timeout_ms: 1000
  pool_size: 20

# PostgreSQL 配置：租户主数据、API Key 的持久化存储
postgres:
  host: ${POSTGRES_HOST:-localhost}
  port: ${POSTGRES_PORT:-5432}
  user: ${POSTGRES_USER:-gateway}
  password: ${POSTGRES_PASSWORD:-}
  dbname: ${POSTGRES_DB:-gateway_db}
  sslmode: ${POSTGRES_SSLMODE:-disable} # 生产环境改成 require 或更高

# 模型路由表：对应"多模型路由"这个验收点
# name 需要和请求 body 里的 "model" 字段完全一致。
# 注意：租户配置不在这里 —— 租户数据在 PostgreSQL 里，
# 由 cmd/seed 工具导入（见 seed/tenants.yaml）。
models:
  - name: qwen2.5-7b-instruct-awq
    backend: ${BACKEND_QWEN_AWQ:-http://localhost:30800}

  - name: qwen2.5
    backend: ${BACKEND_QWEN:-http://localhost:11434}

  - name: llama3
    backend: ${BACKEND_LLAMA3:-http://localhost:11434}
    # 如果以后接入真正的第二个后端（比如 vLLM），把 backend 换成
    # 它的地址即可，比如 http://localhost:8000
    # 注意：vLLM 默认走 OpenAI 兼容接口（/v1/chat/completions），
    # 跟 Ollama 原生接口（/api/generate）请求/响应格式不同，
    # 直接透传会有协议不匹配的问题，这个先记着，等你要接 vLLM
    # 时我们再专门处理协议转换。

# 到模型后端的连接池与超时。0 = 使用内置默认值。
upstream:
  dial_timeout_ms: 3000
  # 非流式（stream:false）请求要等整段生成完才有响应头，所以这里必须 >= 最长单次生成耗时
  response_header_timeout_seconds: 300
  # 流式响应中，上游连续这么久没吐出任何数据就中断（后端假死保护）
  stream_idle_timeout_seconds: 60
  idle_conn_timeout_seconds: 90
  max_idle_conns_per_host: 64
  max_conns_per_host: 0   # 0 = 不限制；想给单个后端做硬性并发上限时再设置